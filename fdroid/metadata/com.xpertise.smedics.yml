Summary: Secours de rue — alerte les street medics à proximité
Description: "Street Medics FR connecte les secouristes de rue aux personnes en détresse.\n\
  \n* Un patient envoie un SOS → sa position apparaît en temps réel sur la carte\n\
  \  des medics disponibles à proximité.\n* Un medic prend en charge → le patient\
  \ suit son arrivée en direct.\n* Envoyer un SOS rend automatiquement hors service\
  \ (on est victime, pas secouriste).\n* 100% open source, OpenStreetMap uniquement,\
  \ aucune donnée revendue.\n\n== Devenir street medic ==\n\n1. Ouvrez l'onglet «\
  \ SOS » et appuyez sur « Devenir street medic ».\n2. Créez votre compte (email +\
  \ mot de passe) ou connectez-vous.\n3. Indiquez votre nom et votre numéro de téléphone.\n\
  4. Appuyez sur « Prendre le service » → vous apparaissez sur la carte.\n5. Vous\
  \ recevez une notification quand un SOS est émis à proximité.\n6. Prenez en charge\
  \ le SOS → le patient suit votre position en direct.\n7. Appuyez sur « Terminer\
  \ mon service » quand vous avez fini.\n\n== Les 3 onglets ==\n\n* **SOS** — Envoyer\
  \ votre position en cas d'urgence, ou prendre le service\n  comme street medic.\n\
  * **Carte** — Voir les SOS et les medics disponibles en temps réel\n  (réservé aux\
  \ medics en service et aux patients qui ont envoyé un SOS).\n* **Réglages** — Permissions,\
  \ langue, rayon d'alerte, nom du medic.\n\n== Localisation en arrière-plan ==\n\n\
  La permission « Localisation toujours active » est demandée uniquement pour\ndeux\
  \ cas :\n* Les personnes qui ont envoyé un SOS → leur position continue d'être\n\
  \  partagée pour que le medic qui arrive puisse les trouver.\n* Les medics qui se\
  \ déplacent vers un blessé → leur position est mise à\n  jour en arrière-plan pour\
  \ guider le patient.\n\nSi vous n'êtes ni l'un ni l'autre, cette permission n'est\
  \ pas nécessaire.\n\n== Langues ==\n\nL'application est disponible en 24 langues\
  \ : anglais, français, espagnol,\nallemand, italien, portugais, néerlandais, polonais,\
  \ russe, turc, arabe,\nchinois, japonais, coréen, hindi, bengali, ourdou, indonésien,\
  \ vietnamien,\nthaï, roumain, ukrainien, grec, hébreu, swahili.\n"
